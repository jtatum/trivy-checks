---
- id: CMD-0036
  key: kubeletStreamingConnectionIdleTimeoutArgumentSet
  title: kubelet --streaming-connection-idle-timeout argument is set
  nodeType: worker
  audit: >-
    ps -eo args |
    awk -v bin="$kubelet.bins" '{name=$1; sub(/^.*\//, "", name); if (name == bin) print}' |
    grep ' --streamingConnectionIdleTimeout' |
    grep -o ' --streamingConnectionIdleTimeout=[^"]\S*' |
    awk -F "=" '{print $2}' |
    awk 'FNR <= 1'
  platforms:
    - k8s
    - eks
    - rke2
