---
- id: CMD-0032
  key: kubeletAnonymousAuthArgumentSet
  title: kubelet --anonymous-auth argument is set
  nodeType: worker
  audit: >-
    ps -eo args |
    awk -v bin="$kubelet.bins" '{name=$1; sub(/^.*\//, "", name); if (name == bin) print}' |
    grep ' --anonymous-auth' |
    grep -o ' --anonymous-auth=[^"]\S*' |
    awk -F "=" '{print $2}' |
    awk 'FNR <= 1'
  platforms:
    - k8s
    - eks
    - rke2
