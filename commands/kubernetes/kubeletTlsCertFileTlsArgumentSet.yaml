---
- id: CMD-0041
  key: kubeletTlsCertFileTlsArgumentSet
  title: kubelet --tls-cert-file argument is set
  nodeType: worker
  audit: >-
    ps -eo args |
    awk -v bin="$kubelet.bins" '{name=$1; sub(/^.*\//, "", name); if (name == bin) print}' |
    grep ' --tls-cert-file' |
    grep -o ' --tls-cert-file=[^"]\S*' |
    awk -F "=" '{print $2}' |
    awk 'FNR <= 1'
  platforms:
    - k8s
    - rke2
