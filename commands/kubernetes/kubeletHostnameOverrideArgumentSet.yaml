---
- id: CMD-0039
  key: kubeletHostnameOverrideArgumentSet
  title: kubelet hostname-override argument is set
  nodeType: worker
  audit: >-
    ps -eo args |
    awk -v bin="$kubelet.bins" '{name=$1; sub(/^.*\//, "", name); if (name == bin) print}' |
    grep ' --hostname-override' |
    grep -o ' --hostname-override=[^"]\S*' |
    awk -F "=" '{print $2}' |
    awk 'FNR <= 1'
  platforms:
    - k8s
    - rke2
