---
- id: CMD-0035
  key: kubeletReadOnlyPortArgumentSet
  title: kubelet --read-only-port argument is set
  nodeType: worker
  audit: >-
    ps -eo args |
    awk -v bin="$kubelet.bins" '{name=$1; sub(/^.*\//, "", name); if (name == bin) print}' |
    grep ' --read-only-port' |
    grep -o ' --read-only-port=[^"]\S*' |
    awk -F "=" '{print $2}' |
    awk 'FNR <= 1'
  platforms:
    - k8s
    - eks
    - rke2
