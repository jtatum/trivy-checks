---
- id: CMD-0028
  key: certificateAuthoritiesFilePermissions
  title: Client certificate authorities file permissions
  nodeType: worker
  audit: >-
    stat -c %a $(ps -eo args |
    awk -v bin="kubelet" '{name=$1; sub(/^.*\//, "", name); if (name == bin) print}' |
    grep 'client-ca-file' |
    grep -o 'client-ca-file=[^"]\S*' |
    awk -F "=" '{print $2}' |
    awk 'FNR <= 1') 2> /dev/null
  platforms:
    - k8s
    - rke2
