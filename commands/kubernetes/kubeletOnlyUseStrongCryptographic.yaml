---
- id: CMD-0045
  key: kubeletOnlyUseStrongCryptographic
  title: Kubelet only makes use of Strong Cryptographic
  nodeType: worker
  audit: >-
    ps -eo args |
    awk -v bin="$kubelet.bins" '{name=$1; sub(/^.*\//, "", name); if (name == bin) print}' |
    grep 'TLSCipherSuites' |
    grep -o 'TLSCipherSuites=[^"]\S*' |
    awk -F "=" '{print $2}' |
    awk 'FNR <= 1'
  platforms:
    - k8s
    - rke2
